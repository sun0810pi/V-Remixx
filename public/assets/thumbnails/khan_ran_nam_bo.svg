<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg_khan_ran_nam_bo" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF5EC"/>
    </radialGradient>
    <linearGradient id="silk_khan_ran_nam_bo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C221E"/>
      <stop offset="100%" stop-color="#1A1513" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="gold_khan_ran_nam_bo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9E8B6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8222"/>
    </linearGradient>
  </defs>

  <!-- Clean Fashion Studio Card Background -->
  <rect width="200" height="200" rx="16" fill="url(#bg_khan_ran_nam_bo)"/>
  <rect x="5" y="5" width="190" height="190" rx="13" fill="none" stroke="#EAE0D2" stroke-width="1.2"/>
  <circle cx="100" cy="92" r="56" fill="#2C221E" fill-opacity="0.08"/>

  <!-- Centered Isolated Garment Illustration -->
  <g transform="translate(100, 92)">
    
      <!-- Checkered Cotton Scarf Folded with Fringed Hem -->
      <rect x="-35" y="-35" width="70" height="70" rx="4" fill="#FAF6F0" stroke="#2C221E" stroke-width="1.2"/>
      <!-- Checkerboard Pattern -->
      <rect x="-35" y="-21" width="14" height="14" fill="#2C221E"/><rect x="-35" y="7" width="14" height="14" fill="#2C221E"/><rect x="-21" y="-35" width="14" height="14" fill="#2C221E"/><rect x="-21" y="-7" width="14" height="14" fill="#2C221E"/><rect x="-21" y="21" width="14" height="14" fill="#2C221E"/><rect x="-7" y="-21" width="14" height="14" fill="#2C221E"/><rect x="-7" y="7" width="14" height="14" fill="#2C221E"/><rect x="7" y="-35" width="14" height="14" fill="#2C221E"/><rect x="7" y="-7" width="14" height="14" fill="#2C221E"/><rect x="7" y="21" width="14" height="14" fill="#2C221E"/><rect x="21" y="-21" width="14" height="14" fill="#2C221E"/><rect x="21" y="7" width="14" height="14" fill="#2C221E"/>
    
  </g>

  <!-- Editorial Typographic Label -->
  <text x="100" y="176" font-family="serif" font-size="11" font-weight="600" fill="#3D2820" text-anchor="middle" letter-spacing="0.5">Khăn Rằn Nam Bộ</text>
</svg>