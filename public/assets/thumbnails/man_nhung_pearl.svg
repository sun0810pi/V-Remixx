      <ellipse cx="0" cy="0" rx="42" ry="25" fill="none" stroke="url(#gold_man_nhung_pearl)" stroke-width="2.5"/>
      <!-- Hand Sewn Pearls Ring -->
      <circle cx="38.0" cy="0.0" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="32.9" cy="11.0" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="19.0" cy="19.1" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="0.0" cy="22.0" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="-19.0" cy="19.1" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="-32.9" cy="11.0" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="-38.0" cy="0.0" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="-32.9" cy="-11.0" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="-19.0" cy="-19.1" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="-0.0" cy="-22.0" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="19.0" cy="-19.1" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/><circle cx="32.9" cy="-11.0" r="2.8" fill="#FAF6F0" stroke="#D1C7BA" stroke-width="0.6"/>
    
  </g>

  <!-- Editorial Typographic Label -->
  <text x="100" y="176" font-family="serif" font-size="11" font-weight="600" fill="#3D2820" text-anchor="middle" letter-spacing="0.5">Mấn Nhung Đính Ngọc</text>
